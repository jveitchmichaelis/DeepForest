defaults:
  - config
  - _self_

architecture: treeformer
model:
    name: ~
log_root: ./logs/treeformer
batch_size: 32
workers: 8
accelerator: auto
precision: bf16-mixed
matmul_precision: high
score_thresh: 0.3
ema_decay: 0.999
label_dict:
    Bird: 0

num_classes: 1

train:
    csv_file: /blue/ewhite/b.weinstein/bird_detector_retrain/data/train.csv
    root_dir: /blue/ewhite/b.weinstein/bird_detector_retrain/data
    optimizer:
      type: AdamW
      weight_decay: 1e-5
    lr: 2e-4
    epochs: 40
    scheduler:
        type: cosine
        params:
            T_max: 40
            eta_min: 1e-7
    validate_labels: false
    # PadIfNeeded must come AFTER geometric transforms (flip/rotate/etc).
    # K.PadTo uses an identity transform matrix, so if it runs first, any
    # subsequent flip/rotate computes label coords in the original (pre-pad)
    # image space while the pixel content is transformed in the padded space,
    # causing a large label offset. Safe order: geo transforms -> pad -> crop.
    augmentations:
      - HorizontalFlip:
          p: 0.5
      - VerticalFlip:
          p: 0.5
      - Rotate:
          degrees: 180
          p: 0.5
      - RandomBrightnessContrast:
          brightness: 0.2
          contrast: 0.2
          p: 0.5
      - HueSaturationValue:
          hue: 0.05
          saturation: 0.2
          p: 0.5
      - PadIfNeeded:
          size: [1024, 1024]
      - RandomCrop:
          size: [1024, 1024]
          p: 1.0

validation:
    csv_file: /blue/ewhite/b.weinstein/bird_detector_retrain/data/test.csv
    root_dir: /blue/ewhite/b.weinstein/bird_detector_retrain/data
    distance_threshold: 10.0
    validate_labels: false
    val_accuracy_interval: 1
    val_batch_size: 4
    augmentations: []

keypoint:
    density_sigma: 3.0
    mae_weight: 0.5
    count_cls_weight: 0.1
    ot_weight: 0.1
    density_l1_weight: 0.05
    sinkhorn_reg: 1.0
    num_of_iter_in_ot: 100
    score_integration_radius: 2
    losses: [count, ot, density_l1]
    norm_cood: false
    enforce_count: false
