# Stage 1 of 2: pretrain RetinaNet with a DINOv3 backbone on lidar-derived
# tree crowns. Run with --export-hf, then pass the exported hf_model_last
# folder as model.name to dinov3-finetune.yaml.
#
# Based on the lidar-pretrain-holdout runs on Comet (silver_brad_2424).
defaults:
  - tree-detector
  - _self_

architecture: retinanet_dinov3

# The facebook/dinov3 repositories are gated: accept the license on
# Hugging Face and log in before first use.
model:
  name: facebook/dinov3-vitl16-pretrain-sat493m
  revision: f692fa42da72c6797b67cd73494a168d1120d3ee

train:
  # Train only the feature pyramid and the detection head
  freeze_backbone: True
  lr: 0.04

# map_50 gives a better target than val_loss
validation:
  checkpoint_target: map_50
