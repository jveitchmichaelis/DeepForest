# OAM-TCD (restor/tcd) dataset config for Mask R-CNN.
# Aligned with Restor-Foundation/tcd Detectron2 baseline:
#   src/tcd_pipeline/config/model/detectron2/detectron_mask_rcnn.yaml
#   IMS_PER_BATCH=8, MAX_ITER=100000, BASE_LR=0.001, FREEZE_AT=2,
#   SCORE_THRESH_TEST=0.2, DETECTIONS_PER_IMAGE=512, AMP enabled,
#   stepped LR @ iter 80000/90000 (gamma=0.1).

defaults:
    - polygon
    - _self_

batch_size: 8
workers: 8

log_root: ./logs/maskrcnn

label_dict:
    tree: 0
    canopy: 1
num_classes: 2

score_thresh: 0.2
# Paper: MODEL.ROI_HEADS.NMS_THRESH_TEST = 0.5 (vs the polygon default 0.3).
nms_thresh: 0.5
detections_per_img: 512

maskrcnn:
    trainable_backbone_layers: 3
    # Paper RPN: POST_NMS_TOPK_TRAIN=1000 (torchvision default is 2000);
    # PRE_NMS_TOPK_TRAIN=2000 matches the torchvision default.
    rpn_post_nms_top_n_train: 1000
    rpn_pre_nms_top_n_test: 512
    rpn_post_nms_top_n_test: 512
    # Steady-state CUDA peak is ~17 GB on 192 GB B200; recomputing
    # activations in the backward isn't necessary here.
    gradient_checkpointing: false

gradient_clip_val: null
precision: 16-mixed

train:
    csv_file: data/tcd/train.json
    root_dir: data/tcd/train/images
    lr: 0.005   # paper BASE_LR
    optimizer:
        type: SGD
        weight_decay: 0.0001
        momentum: 0.9
    scheduler:
        type: multistepLR
        params:
            # Paper STEPS=[30k, 48k, 54k]/60k = 50%/80%/90% of training.
            milestones: [50, 80, 90]
            gamma: 0.1
            # Detectron2 uses 1000-iter warmup at bs=8 (~1 epoch on OAM-TCD).
            warmup_epochs: 1
            warmup_start_factor: 0.001
    class_balanced_sampler: false
    class_balanced_loss: false
    epochs: 100
    augmentations:
        # Multi-scale-equivalent crop: matches paper's MIN_SIZE_TRAIN[640..800]
        # downsample range (~2.56-3.2 native px per output px on the 2048
        # source tile) using a continuous scale rather than the paper's
        # discrete choice. Fixed 640×640 output for FPN consistency.
        - HorizontalFlip: {p: 0.5}
        - VerticalFlip: {p: 0.5}
        - RandomResizedCrop:
            size: [640, 640]
            scale: [0.64, 1.0]
            ratio: [1.0, 1.0]
            p: 1.0

validation:
    csv_file: data/tcd/test.json
    root_dir: data/tcd/test/images
    # Val step + segm mAP cost a lot for this model; run every 5 epochs.
    # Also gates ``check_val_every_n_epoch`` in the trainer.
    val_accuracy_interval: 5
    # Reduce val time dunring training. 
    augmentations:
        - Resize: {max_size: 1024}
