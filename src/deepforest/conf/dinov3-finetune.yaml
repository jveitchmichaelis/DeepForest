# Stage 2 of 2: finetune the DINOv3 RetinaNet on NEON or MillionTrees.
# Starts from the LVD encoder with a new detection head by default. Set
# model.name to an hf_model_last folder exported by dinov3-pretrain.yaml to
# start from a lidar pretrain.
#
# The LVD lidar followup on Comet (dinov3-lidar) favored an unfrozen finetune.
defaults:
  - tree-detector
  - _self_

architecture: retinanet_dinov3

# The facebook/dinov3 repositories are gated: accept the license on
# Hugging Face and log in before first use.
model:
  name: facebook/dinov3-vitl16-pretrain-lvd1689m
  revision: ea8dc2863c51be0a264bab82070e3e8836b02d51

train:
  freeze_backbone: False
  lr: 0.04
