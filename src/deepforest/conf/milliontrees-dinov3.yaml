# Finetune the DINOv3 RetinaNet on MillionTrees at native resolution: the model
# does not resize images. Training randomly crops large images and pads small
# ones to 800 pixels. Validation pads small images and keeps the top-left 800
# pixels of large ones, so its scores differ a little from whole-image scores.
# For final scores, evaluate whole images with batch_size=1
# validation.augmentations=[].
defaults:
  - dinov3-finetune
  - _self_

model:
  resize: False

# MillionTrees images have up to 1642 trees
detections_per_img: 2000
topk_candidates: 2000

log_root: logs/milliontrees

train:
  augmentations:
    - HorizontalFlip: {p: 0.5}
    - RandomCrop: {size: [800, 800], pad_if_needed: true, p: 1.0}

validation:
  augmentations:
    - PadIfNeeded: {size: [800, 800]}
